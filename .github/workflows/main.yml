name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / ${{ matrix.db }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
        rails:
          - '7.2'
          - '8.0'
          - '8.1'
          - 'main'
        db:
          - sqlite
          - postgresql
          - mysql
        exclude:
          # Rails 8.0+ requires Ruby 3.2+
          - ruby: '3.1'
            rails: '8.0'
          - ruby: '3.1'
            rails: '8.1'
          - ruby: '3.1'
            rails: 'main'
          - ruby: '3.2'
            rails: 'main'
          # Only run PostgreSQL and MySQL on one Ruby version per Rails version to limit matrix size
          - ruby: '3.1'
            db: postgresql
          - ruby: '3.1'
            db: mysql
          - ruby: '3.2'
            db: postgresql
          - ruby: '3.2'
            db: mysql
          - ruby: '4.0'
            db: postgresql
          - ruby: '4.0'
            db: mysql

    services:
      postgres:
        image: ${{ matrix.db == 'postgresql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: active_storage_dedup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: active_storage_dedup_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB: ${{ matrix.db }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: root

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Install dependencies
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        run: |
          gem install bundler
          if [ "$RAILS_VERSION" = "main" ]; then
            bundle config set --local gemfile Gemfile
            bundle remove rails activestorage --skip-install || true
            bundle add rails --git https://github.com/rails/rails.git --skip-install
            bundle add activestorage --git https://github.com/rails/rails.git --skip-install
            bundle install
          else
            bundle config set --local gemfile Gemfile
            bundle remove rails activestorage --skip-install || true
            bundle add rails --version "~> ${RAILS_VERSION}.0" --skip-install
            bundle add activestorage --version "~> ${RAILS_VERSION}.0" --skip-install
            bundle install
          fi
      - name: Run the default task
        run: bundle exec rake
